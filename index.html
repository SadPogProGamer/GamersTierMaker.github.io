<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tier List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="tier-layout">
        <section class="tier-list">
          <article class="tier-card tier-top">
            <span>Top 10</span>
          </article>
          <article class="tier-card tier-11-20">
            <span>Top 11-20</span>
          </article>
          <article class="tier-card tier-21-30">
            <span>Top 21-30</span>
          </article>
          <article class="tier-card tier-s">
            <span>S</span>
          </article>
          <article class="tier-card tier-a">
            <span>A</span>
          </article>
          <article class="tier-card tier-b">
            <span>B</span>
          </article>
          <article class="tier-card tier-c">
            <span>C</span>
          </article>
          <article class="tier-card tier-d">
            <span>D</span>
          </article>
          <article class="tier-card tier-f">
            <span>F</span>
          </article>
          <article class="tier-card tier-worst">
            <span>The world would have been better without</span>
          </article>
        </section>

        <aside class="side-panel">
          <div class="panel-inner">
            <div class="panel-icon">⚙</div>
            <div class="panel-actions">
              <button class="panel-btn">▲</button>
              <button class="panel-btn">▼</button>
            </div>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
