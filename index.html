<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TIER LIST MAKER · KINGS OF THE JUNGLE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* avoid accidental text selection while dragging */
        }

        /* ===== GLOBAL ===== */
        body {
            margin: 0;
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            background: #0a0c0f;
            color: #eef2ff;
            padding: 20px 24px 40px 24px;
        }

        /* ===== HEADER ===== */
        .title-section {
            text-align: center;
            margin-bottom: 28px;
        }
        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e6b0, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin: 0 0 6px 0;
        }
        .sub {
            font-size: 0.85rem;
            color: #aaa;
            border-top: 1px solid #2c2f36;
            display: inline-block;
            padding-top: 6px;
        }

        /* ===== TIER CONTAINER ===== */
        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0 30px 0;
        }

        /* Each row: square left panel + items grid */
        .tier-row {
            display: flex;
            background: #15171e;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            border: 1px solid #2a2e3a;
        }

        /* LEFT SQUARE WITH LETTER + ARROW + CORKWHEEL (like reference) */
        .tier-badge {
            width: 100px;
            min-width: 100px;
            background: #000000;  /* pure black square */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 32px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #FFD966;
            border-right: 2px solid #2f3542;
            position: relative;
            gap: 6px;
            padding: 8px 0;
            box-shadow: inset 0 0 0 1px rgba(255,215,0,0.2);
        }
        /* corkwheel + arrow icon group */
        .badge-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 22px;
            color: #b9b9b9;
            opacity: 0.85;
        }
        .badge-icons span {
            filter: drop-shadow(0 1px 1px black);
        }
        .tier-letter {
            font-size: 40px;
            line-height: 1;
            text-shadow: 0 2px 0 #7a5c00;
            margin-top: 4px;
        }
        /* optional small rank label under letter? but we keep clean */
        .tier-sublabel {
            font-size: 9px;
            letter-spacing: 1px;
            background: #1f1f2a;
            padding: 2px 8px;
            border-radius: 30px;
            color: #ccc;
            font-weight: normal;
            font-family: monospace;
        }

        /* RIGHT ITEMS AREA: grid with square cells */
        .tier-items {
            flex: 1;
            background: #1e212a;
            display: grid;
            grid-template-columns: repeat(auto-fill, 82px);
            grid-auto-rows: 82px;
            gap: 8px;
            padding: 12px;
            min-height: 106px;
            align-content: flex-start;
            transition: background 0.1s;
        }
        /* drag-over effect for each tier */
        .tier-items.drag-over {
            background: #2c3142;
            box-shadow: inset 0 0 0 2px #ffc857;
        }

        /* ===== IMAGE ITEMS (draggable squares) ===== */
        .item {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 10px;
            cursor: grab;
            background: #2f3540;
            display: block;
            border: 2px solid transparent;
            transition: transform 0.1s ease, border 0.1s, box-shadow 0.1s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .item:active {
            cursor: grabbing;
        }
        .item.dragging {
            opacity: 0.5;
            transform: scale(0.96);
            cursor: grabbing;
        }
        /* hover effect */
        .item:hover {
            border: 2px solid #ffc857;
            transform: scale(1.02);
            box-shadow: 0 4px 10px black;
        }

        /* ===== IMAGE POOL (bottom reservoir) ===== */
        .pool-section {
            margin-top: 30px;
            background: #0f1117;
            border-radius: 24px;
            padding: 16px 14px;
            border: 1px solid #2c2f38;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }
        .pool-title {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 14px;
            font-weight: bold;
            font-size: 1.2rem;
            padding-left: 6px;
            letter-spacing: 1px;
            color: #f3d382;
        }
        .pool-title span:first-child {
            background: #000000aa;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-family: monospace;
        }
        .pool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 82px);
            grid-auto-rows: 82px;
            gap: 8px;
            min-height: 140px;
            padding: 4px;
            background: #12141c;
            border-radius: 20px;
        }

        /* ===== BUTTON CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin: 20px 0 12px;
        }
        button {
            background: #23262f;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 22px;
            border-radius: 40px;
            color: #f0f0f0;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px black;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        button i { font-style: normal; font-weight: bold; }
        button:hover {
            background: #3a3f50;
            transform: scale(0.97);
            color: #ffdf9c;
        }
        .reset-btn {
            background: #2a2418;
            border: 1px solid #ad8b3c;
        }
        .upload-label {
            background: #1f2a2e;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        input[type="file"] {
            display: none;
        }
        .info-text {
            font-size: 0.75rem;
            text-align: center;
            color: #6c7285;
            margin-top: 24px;
        }

        /* Scroll handling */
        .tier-items, .pool-grid {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
        }
        /* responsive */
        @media (max-width: 700px) {
            body { padding: 12px; }
            .tier-badge { width: 70px; min-width: 70px; }
            .tier-letter { font-size: 28px; }
            .badge-icons { font-size: 16px; gap: 4px; }
            .item, .tier-items, .pool-grid { width: 70px; height: 70px; }
            .tier-items { grid-template-columns: repeat(auto-fill, 70px); grid-auto-rows: 70px; gap: 6px; }
            .pool-grid { grid-template-columns: repeat(auto-fill, 70px); grid-auto-rows: 70px; }
            .item { width: 70px; height: 70px; }
        }

        /* empty state placeholder */
        .empty-placeholder {
            color: #4a4f62;
            font-size: 0.8rem;
            text-align: center;
            padding: 28px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="title-section">
    <h1>🐾 KINGS OF THE JUNGLE 🦁</h1>
    <div class="sub">totally radical tier list · drag & drop to rank</div>
</div>

<div class="tier-list" id="tierListContainer"></div>

<div class="controls">
    <button id="resetBtn" class="reset-btn">⟳ RESET ALL</button>
    <label class="upload-label" for="imageUpload">📸 + ADD IMAGES</label>
    <input type="file" id="imageUpload" accept="image/*" multiple>
    <button id="clearPoolBtn">🗑 CLEAR POOL</button>
</div>

<div class="pool-section">
    <div class="pool-title">
        <span>🐚 UNRANKED POOL</span>
        <span style="font-size:0.7rem;">drag any image into tiers</span>
    </div>
    <div class="pool-grid" id="poolGrid"></div>
</div>
<div class="info-text">
    💡 Drag images between tiers & pool · each tier left square shows letter + arrow & corkwheel style
</div>

<script>
    // --------------------------------------------------------------
    // TIER DEFINITIONS (matches "Top 10", "Kings of the Jungle", "Totally Radical!" etc)
    // but we create modern ranks with iconic letter + full names like reference description
    // reference text: "Top 10", "Kings of the Jungle", "Totally Radical!", "Provides Some Interest",
    // "Average", "Boring or Bleh", "Hornet Tier", "Never heard of"
    // We'll map each with a distinct letter and full title inside the square tooltip, but left square shows letter + icons.
    const TIERS = [
        { id: "top10", letter: "S",   name: "TOP 10",          bgHint: "#1F2A1E" },
        { id: "kings", letter: "A+",  name: "KINGS OF THE JUNGLE", bgHint: "#2A2A1A" },
        { id: "radical", letter: "A", name: "TOTALLY RADICAL!", bgHint: "#2B2B1F" },
        { id: "interest", letter: "B", name: "PROVIDES SOME INTEREST", bgHint: "#25282E" },
        { id: "average", letter: "C", name: "AVERAGE", bgHint: "#282B2F" },
        { id: "boring", letter: "D", name: "BORING OR BLEH", bgHint: "#2E2525" },
        { id: "hornet", letter: "F", name: "HORNET TIER", bgHint: "#312222" },
        { id: "never", letter: "?", name: "NEVER HEARD OF", bgHint: "#1F1F28" }
    ];

    // Data model: each item has unique id, src (dataURL or blob url), original title (filename)
    let allItems = [];          // { id, src, label }
    // tierMap: each tier id -> array of item ids (order maintained)
    let tierData = {
        top10: [],
        kings: [],
        radical: [],
        interest: [],
        average: [],
        boring: [],
        hornet: [],
        never: []
    };
    let poolItemIds = [];       // ids that are not assigned to any tier

    let nextId = 1;
    let dragSourceInfo = { type: null, tierId: null, itemId: null, index: -1 };

    // Helper: get DOM elements
    const tierContainer = document.getElementById("tierListContainer");
    const poolGridEl = document.getElementById("poolGrid");

    // render all tiers and pool
    function renderFullUI() {
        renderTiers();
        renderPool();
    }

    // render tier rows based on tierData
    function renderTiers() {
        tierContainer.innerHTML = "";
        for (let tier of TIERS) {
            const itemIds = tierData[tier.id] || [];
            const row = document.createElement("div");
            row.className = "tier-row";
            row.setAttribute("data-tier-id", tier.id);

            // LEFT SQUARE (letter + arrow + corkwheel)
            const leftBadge = document.createElement("div");
            leftBadge.className = "tier-badge";
            // inner: letter + icons (arrow & corkwheel)
            leftBadge.innerHTML = `
                <div class="badge-icons">
                    <span>⬆️</span>
                    <span>⚙️</span>
                </div>
                <div class="tier-letter">${tier.letter}</div>
                <div class="tier-sublabel">${tier.name.substring(0, 12)}${tier.name.length>12?'..':''}</div>
            `;
            // add optional tooltip with full name
            leftBadge.title = tier.name;
            
            // RIGHT items container (drop zone)
            const itemsContainer = document.createElement("div");
            itemsContainer.className = "tier-items";
            itemsContainer.setAttribute("data-tier-id", tier.id);
            
            // populate items from tierData
            for (let itemId of itemIds) {
                const item = allItems.find(i => i.id === itemId);
                if (item) {
                    const img = createDraggableImage(item, 'tier', tier.id);
                    itemsContainer.appendChild(img);
                }
            }
            
            // if empty and we want subtle placeholder, but we just leave grid (empty looks fine)
            row.appendChild(leftBadge);
            row.appendChild(itemsContainer);
            
            // DRAG & DROP events on container (drop target)
            itemsContainer.addEventListener("dragover", (e) => {
                e.preventDefault();
                itemsContainer.classList.add("drag-over");
            });
            itemsContainer.addEventListener("dragleave", () => {
                itemsContainer.classList.remove("drag-over");
            });
            itemsContainer.addEventListener("drop", (e) => {
                e.preventDefault();
                itemsContainer.classList.remove("drag-over");
                const targetTierId = itemsContainer.getAttribute("data-tier-id");
                handleDropIntoTier(targetTierId);
            });
            
            tierContainer.appendChild(row);
        }
    }

    // create draggable image element with data attributes
    function createDraggableImage(item, sourceType, sourceId = null) {
        const img = document.createElement("img");
        img.src = item.src;
        img.className = "item";
        img.setAttribute("data-id", item.id);
        img.setAttribute("draggable", "true");
        img.setAttribute("data-source-type", sourceType); // 'tier' or 'pool'
        if (sourceId) img.setAttribute("data-source-id", sourceId);
        img.alt = item.label || "tier item";
        
        img.addEventListener("dragstart", (e) => {
            // store dragging item info
            const itemId = parseInt(img.getAttribute("data-id"));
            const srcType = img.getAttribute("data-source-type");
            const srcTier = img.getAttribute("data-source-id") || null;
            dragSourceInfo = {
                type: srcType,
                tierId: srcTier,
                itemId: itemId,
                element: img
            };
            e.dataTransfer.setData("text/plain", itemId.toString());
            e.dataTransfer.effectAllowed = "move";
            img.classList.add("dragging");
        });
        img.addEventListener("dragend", (e) => {
            img.classList.remove("dragging");
            dragSourceInfo = { type: null, tierId: null, itemId: null };
        });
        return img;
    }
    
    // render pool (unassigned items)
    function renderPool() {
        poolGridEl.innerHTML = "";
        if (poolItemIds.length === 0) {
            const emptyMsg = document.createElement("div");
            emptyMsg.className = "empty-placeholder";
            emptyMsg.innerText = "✨ No images — click '+ ADD IMAGES' to start ✨";
            poolGridEl.appendChild(emptyMsg);
        } else {
            for (let id of poolItemIds) {
                const item = allItems.find(i => i.id === id);
                if (item) {
                    const img = createDraggableImage(item, 'pool', null);
                    poolGridEl.appendChild(img);
                }
            }
        }
        // make pool itself a drop target to move items back from tiers
        poolGridEl.addEventListener("dragover", (e) => {
            e.preventDefault();
            poolGridEl.style.backgroundColor = "#1f2330";
        });
        poolGridEl.addEventListener("dragleave", () => {
            poolGridEl.style.backgroundColor = "";
        });
        poolGridEl.addEventListener("drop", (e) => {
            e.preventDefault();
            poolGridEl.style.backgroundColor = "";
            moveDraggedItemToPool();
        });
    }
    
    // core: handle drop into a tier container
    function handleDropIntoTier(targetTierId) {
        if (!dragSourceInfo.itemId) return;
        const { type, tierId: sourceTierId, itemId } = dragSourceInfo;
        const itemExists = allItems.some(i => i.id === itemId);
        if (!itemExists) return;
        
        // case 1: dragging from pool -> add to target tier, remove from pool
        if (type === 'pool') {
            // remove from pool
            const poolIndex = poolItemIds.indexOf(itemId);
            if (poolIndex !== -1) poolItemIds.splice(poolIndex, 1);
            // add to target tier
            if (!tierData[targetTierId]) return;
            tierData[targetTierId].push(itemId);
            reorderAndSyncRender();
            return;
        }
        // case 2: dragging from another tier -> move to new tier
        if (type === 'tier' && sourceTierId) {
            // remove from source tier
            if (tierData[sourceTierId]) {
                const idx = tierData[sourceTierId].indexOf(itemId);
                if (idx !== -1) tierData[sourceTierId].splice(idx, 1);
            }
            // add to target tier
            if (tierData[targetTierId]) {
                tierData[targetTierId].push(itemId);
            }
            reorderAndSyncRender();
            return;
        }
        // else ignore
    }
    
    // move dragged item to pool (when dropped on pool)
    function moveDraggedItemToPool() {
        if (!dragSourceInfo.itemId) return;
        const { type, tierId: sourceTierId, itemId } = dragSourceInfo;
        if (type === 'tier' && sourceTierId) {
            // remove from source tier
            if (tierData[sourceTierId]) {
                const idx = tierData[sourceTierId].indexOf(itemId);
                if (idx !== -1) tierData[sourceTierId].splice(idx, 1);
            }
            // add to pool if not already present
            if (!poolItemIds.includes(itemId)) {
                poolItemIds.push(itemId);
            }
            reorderAndSyncRender();
        } else if (type === 'pool') {
            // already in pool, do nothing
            return;
        }
    }
    
    // full rerender after data changes
    function reorderAndSyncRender() {
        renderTiers();
        renderPool();
    }
    
    // reset everything: remove all items, clear tiers, reset pool
    function resetAll() {
        allItems = [];
        tierData = {
            top10: [],
            kings: [],
            radical: [],
            interest: [],
            average: [],
            boring: [],
            hornet: [],
            never: []
        };
        poolItemIds = [];
        nextId = 1;
        renderFullUI();
    }
    
    // add new images from FileList
    function addImages(files) {
        if (!files.length) return;
        let loadedCount = 0;
        Array.from(files).forEach(file => {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const src = e.target.result;
                const newId = nextId++;
                const fileName = file.name.length > 28 ? file.name.slice(0,24)+'...' : file.name;
                const newItem = {
                    id: newId,
                    src: src,
                    label: fileName
                };
                allItems.push(newItem);
                // by default, new items go to POOL (unranked)
                poolItemIds.push(newId);
                loadedCount++;
                if (loadedCount === files.length || loadedCount === Array.from(files).filter(f=>f.type.startsWith('image/')).length) {
                    renderFullUI();
                }
            };
            reader.readAsDataURL(file);
        });
        // if no valid images, just re-render anyway
        if (Array.from(files).filter(f=>f.type.startsWith('image/')).length === 0) return;
        // lazy rendering already inside each onload, but final safety:
        setTimeout(() => {
            renderFullUI();
        }, 50);
    }
    
    // clear pool (remove all items that are in pool, but also from allItems? design: remove from app entirely)
    function clearPoolOnly() {
        // remove items that belong to pool from global allItems and from tiers (if any, but normally pool items not in tiers)
        const toRemoveIds = [...poolItemIds];
        // also, these items might accidentally be referenced? but poolItemIds only holds unassigned.
        // Remove from allItems
        allItems = allItems.filter(item => !toRemoveIds.includes(item.id));
        // also clean any tier that might have those ids? consistency: by definition pool items are not in tiers, but safe
        for (let tierId of Object.keys(tierData)) {
            tierData[tierId] = tierData[tierId].filter(id => !toRemoveIds.includes(id));
        }
        poolItemIds = [];
        renderFullUI();
    }
    
    // Extra: load some default demo images from placeholder API? but we don't need external, but provide sample images? I'll add 4 default funny placeholders from FontAwesome? But we generate canvas placeholder for demo.
    function addDefaultDemoImages() {
        // create 6 demo images using canvas (cute emojis / animals) to illustrate "Kings of the jungle"
        const demoList = ['🐘 ELEPHANT', '🦁 LION', '🐅 TIGER', '🦍 GORILLA', '🐊 CROCODILE', '🦒 GIRAFFE', '🐆 LEOPARD', '🦏 RHINO'];
        demoList.forEach((name, idx) => {
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2d2f36';
            ctx.fillRect(0,0,200,200);
            ctx.fillStyle = '#ffd966';
            ctx.font = 'bold 36px "Segoe UI Emoji"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name.charAt(0) + (name.includes(' ') ? name.split(' ')[1]?.charAt(0)||'' : ''), 100, 90);
            ctx.font = '20px Arial';
            ctx.fillStyle = '#eee';
            ctx.fillText(name.substring(0,12), 100, 150);
            const src = canvas.toDataURL();
            const newId = nextId++;
            allItems.push({ id: newId, src: src, label: name });
            poolItemIds.push(newId);
        });
        renderFullUI();
    }
    
    // EVENT LISTENERS
    document.getElementById("resetBtn").addEventListener("click", () => {
        resetAll();
        addDefaultDemoImages();   // after reset, provide some demo images (makes it fun)
    });
    document.getElementById("clearPoolBtn").addEventListener("click", () => {
        clearPoolOnly();
    });
    const fileInput = document.getElementById("imageUpload");
    fileInput.addEventListener("change", (e) => {
        if (e.target.files.length) {
            addImages(e.target.files);
            fileInput.value = ''; // allow re-upload same
        }
    });
    
    // init: add demo images to start with vibrant content
    function init() {
        resetAll(); // ensures clean slate
        addDefaultDemoImages();
    }
    init();
    
    // Extra: make pool drop also listen for existing drag end events from body? already handled.
    window.addEventListener('dragend', (e) => {
        // minor cleanup
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
</script>
</body>
</html>
