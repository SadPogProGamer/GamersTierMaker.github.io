<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TierMaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top-bar">
    <div class="top-bar-title"><img src="images/tiermaker-logo.png" alt="TierMaker logo"></div>
</div>
<div class="tier-app" id="tierApp">
    <div class="tier-list" id="tierContainer"></div>

    <div class="unassigned-section" id="unassignedSection">
        <div class="section-title">
            <span>Unassigned games (drag to tiers)</span>
        </div>
        <div class="unassigned-row">
            <div class="unassigned-items" id="unassignedPool"></div>
            <div class="unassigned-box"></div>
        </div>
    </div>

    <div class="actions-footer">
        <button class="btn btn-primary" id="downloadBtn">Save Tierlist</button>
        <span class="filename-hint" id="fileCounter"></span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
