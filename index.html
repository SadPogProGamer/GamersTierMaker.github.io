<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tier List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="tier-layout">
        <section class="tier-list">
          <article class="tier-card tier-top">
            <span>Top 10</span>
          </article>
          <article class="tier-card tier-kings">
            <span>Kings of the Jungle</span>
          </article>
          <article class="tier-card tier-radical">
            <span>Totally Radical!</span>
          </article>
          <article class="tier-card tier-interest">
            <span>Provides Some Interest</span>
          </article>
          <article class="tier-card tier-average">
            <span>Average</span>
          </article>
          <article class="tier-card tier-boring">
            <span>Boring or Bleh</span>
          </article>
        </section>

        <aside class="side-panel">
          <div class="panel-inner">
            <div class="panel-icon">⚙</div>
            <div class="panel-actions">
              <button class="panel-btn">▲</button>
              <button class="panel-btn">▼</button>
            </div>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
