<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamers Tiermaker</title>

  <link rel="icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/monolith.min.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js" defer></script>
  <script src="https://upload-widget.cloudinary.com/latest/global/loader.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

  <!-- Firebase (still compat for now, but ready to upgrade) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" defer></script>

  <!-- App Entry -->
  <script type="module" src="scripts/main.js"></script>

  <style id="dynamic-styles"></style>
</head>

<body>

  <!-- 🔝 Top Bar -->
  <header class="top-bar">
    <div class="top-bar-content">
      <img src="assets/Logo.jpg" alt="Logo" class="logo" />
      <h1 class="top-title">GAMERS TIERMAKER</h1>

      <div id="auth-container" class="auth-container">
        <span id="user-name" class="hidden"></span>

        <button id="login-btn" class="btn primary">
          Sign in with Google
        </button>

        <div id="profile-dropdown" class="profile-dropdown hidden">
          <img id="profile-avatar" class="profile-avatar" alt="Profile" />
          <div id="profile-menu" class="profile-menu hidden">
            <button class="profile-menu-btn logout-btn">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 🧾 Header -->
  <section class="header-container">
    <h1 id="main-title" class="headerTitle" contenteditable="true">
      Games I played tierlist
    </h1>

    <div class="search-container">
      <input 
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search for a game..."
      />

      <button id="clear-search" class="clear-search-btn">✕</button>

      <div id="total-count" class="total-count hidden">Total: 0</div>
      <div id="search-commands-dropdown" class="search-commands-dropdown hidden"></div>
    </div>
  </section>

  <!-- 🎮 Tier List -->
  <main id="htmlContent">
    <!-- Generated dynamically via JS -->
  </main>

  <!-- 📦 Unassigned -->
  <section class="unassigned-container">
    <div class="unassigned-header">
      Unassigned games <span>(Drag into a tier)</span>
    </div>

    <div id="images-bar" class="sort drop-zone">
      <div class="drop-zone-hint">Drag games here</div>
    </div>
  </section>

  <!-- 🔘 Buttons -->
  <footer id="buttons-container">
    <button id="add-images-btn">Add Images</button>
    <button id="save-tierlist-btn">Save Tierlist</button>
    <button id="download-btn">Download Tierlist</button>
    <button id="download-all-btn">Download All Images</button>
    <button id="export-json-btn">Export Game Details</button>
    <button id="delete-tierlist-btn" class="danger">Delete Tier List</button>
  </footer>

  <!-- 🪟 Modal -->
  <div id="image-modal" class="modal hidden">
    <div class="modal-content">

      <div id="sync-notification" class="sync-notification hidden">
        <span>Sign in to sync across devices</span>
        <button id="modal-signin-btn" class="btn small primary">Sign In</button>
      </div>

      <div class="modal-header">
        <h2>Game Details</h2>
        <span id="sync-status" class="sync-status hidden">Syncing...</span>
        <button class="modal-close" id="close-modal-btn">✕</button>
      </div>

      <div class="modal-body">

        <div class="form-group">
          <label>Name</label>
          <input type="text" id="image-name" />
        </div>

        <div class="form-group">
          <label>Developer</label>
          <input type="text" id="image-developer" />
        </div>

        <div class="form-group">
          <label id="image-date-label">Date Beaten</label>
          <input type="text" id="image-date" />
        </div>

        <div id="image-date-100-group" class="form-group hidden">
          <label>Date 100%</label>
          <input type="text" id="image-date-100" />
        </div>

        <div class="form-group">
          <label>Review</label>
          <textarea id="image-description"></textarea>
        </div>

        <div class="form-group">
          <label>Platform</label>
          <div class="platform-dropdown">
            <button id="platform-btn">Select Platform ▼</button>
            <div id="platform-dropdown-menu" class="hidden">
              <input type="text" id="platform-search" placeholder="Search..." />
              <div id="platform-options"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Completion</label>
          <select id="image-status">
            <option value="">-- No status --</option>
            <option value="Story complete">Story complete</option>
            <option value="100% complete">100% complete</option>
            <option value="Played">Played</option>
            <option value="Dropped">Dropped</option>
          </select>

          <div id="replay-toggle-group" class="hidden">
            <button id="replay-toggle-btn" class="replay-toggle">
              Has 100% replay
            </button>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button id="save-modal-btn">Save</button>
        <button id="delete-image-btn" class="danger">Delete Image</button>
      </div>

    </div>
  </div>

</body>
</html>
