  <body>
    <div class="top-bar">
      <div class="top-bar-content">
        <img src="assets/Logo.jpg" alt="Logo" class="logo">
        <h1 class="top-title">GAMERS TIERMAKER</h1>
        <div id="auth-container" style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
          <span id="user-name" style="color: white; display: none;"></span>
          <button id="login-btn" onclick="signInWithGoogle()" style="padding: 8px 16px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">Sign in with Google</button>
          <div id="profile-dropdown" class="profile-dropdown hidden">
            <img id="profile-avatar" class="profile-avatar" alt="Profile" onclick="toggleProfileDropdown()" title="Account menu">
            <div id="profile-menu" class="profile-menu hidden">
              <button class="profile-menu-btn logout-btn" onclick="signOut()">Sign Out</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="header-container">
      <h1 class="headerTitle" contenteditable="true" spellcheck="true" id="main-title">
        Games I played tierlist
      </h1>
      <div class="search-container" style="position: relative;">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Type here to search for a game"
          onkeyup="filterImages(this.value)"
          oninput="handleSearchInput(this.value)"
        />
        <div id="total-count" class="total-count" style="display:none; position: absolute; right: -120px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 13px;">Total: 0</div>
        <button id="clear-search" class="clear-search-btn" onclick="clearSearch()" title="Clear search">✕</button>
        <div id="search-commands-dropdown" class="search-commands-dropdown hidden"></div>
      </div>
    </div>
   <main id="htmlContent">
      <div class="row">
        <div
          class="tier-label"
          contenteditable="true"
          style="background-color: rgb(191, 255, 127);"
        >
          <p spellcheck="true">Top 10<br>(in order)</p>
          <div class="tooltip" contenteditable="false">
            <div class="color-picker"></div>
          </div>
        </div>
        <div class="tier sort"></div>
        <div class="tier-options">
          <div class="options-container">
            <div class="option delete">
              <img
                class="option-hover"
                src="assets/Cog.png"
                alt="Menu"
                onclick="openRowMenu(this, event)"
              />
            </div>
            <div class="option">
              <img
                class="option-hover"
                src="assets/chevron-up.svg"
                alt="Up"
                onclick="moveRow(this, -1)"
              />
            </div>
            <div class="option">
              <img
                class="option-hover"
                src="assets/chevron-down.svg"
                alt="Down"
                onclick="moveRow(this, 1)"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="unassigned-container">
        <div class="unassigned-header">Unassigned games <span>(Drag into a tier)</span></div>
        <div id="images-bar" class="sort drop-zone" ondrop="handleImageDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
          <div class="drop-zone-hint" id="drop-zone-hint">Drag games here</div>
        </div>
      </div>
    </main>
    <div id="buttons-container">
      <button type="button" onclick="selectImages()">Click here to add images</button>
      <button id="save-tierlist-btn" type="button" onclick="saveTierList()">Save Tierlist</button>
      <button id="btn" type="button">Download Tierlist</button>
      <button id="download-all-btn" type="button" onclick="downloadAllImagesZip()">Download All Images</button>
      <button type="button" onclick="downloadGameDetailsJSON()">Export Game Details</button>
      <button type="button" onclick="deleteTierList()" style="background: #dc3545; color: white;">Delete Tier List</button>
    </div>

    <div id="image-modal" class="modal hidden">
      <div class="modal-content">
        <div id="sync-notification" class="sync-notification hidden">
          <span>Sign in with Google to sync your game data across devices</span>
          <button onclick="signInWithGoogle()" style="padding: 4px 12px; background: #4285f4; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; margin-left: 10px;">Sign In</button>
        </div>
        <div class="modal-header">
          <h2>Game Details</h2>
          <div id="sync-status" class="sync-status" style="display: none; font-size: 12px; color: #666; margin-right: auto; margin-left: 10px;">
            <span id="sync-status-text">Syncing...</span>
          </div>
          <button class="modal-close" onclick="closeImageModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="image-name">Name:</label>
            <input type="text" id="image-name" placeholder="Enter game name">
          </div>
          <!-- Genre field removed -->
          <div class="form-group">
            <label for="image-developer">Developer:</label>
            <input type="text" id="image-developer" placeholder="Enter developer name">
          </div>
          <div class="form-group">
            <label for="image-date" id="image-date-label">Date Beaten:</label>
            <input type="text" id="image-date" placeholder="Enter date">
          </div>
          <div class="form-group hidden" id="image-date-100-group">
            <label for="image-date-100">Date 100%:</label>
            <input type="text" id="image-date-100" placeholder="Enter date 100%">
          </div>
          <div class="form-group">
            <label for="image-description">Personal Review:</label>
            <textarea id="image-description" placeholder="Enter review description"></textarea>
          </div>
          <div class="form-group">
            <label>Platform:</label>
            <div class="platform-dropdown">
              <button type="button" class="platform-dropdown-btn" id="platform-btn" onclick="togglePlatformDropdown()">
                Select Platform ▼
              </button>
              <div id="platform-dropdown-menu" class="platform-dropdown-menu hidden">
                <input 
                  type="text" 
                  id="platform-search" 
                  class="platform-search" 
                  placeholder="Search for a console or platform..."
                />
                <div id="platform-options" class="platform-options"></div>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="image-status">Completion:</label>
            <select id="image-status" onchange="updateDateLabel(); autoSaveMetadataWrapper();">
              <option value="">-- No status --</option>
              <option value="Story complete">Story complete</option>
              <option value="100% complete">100% complete</option>
              <option value="Played">Played</option>
              <option value="dropped">Dropped</option>
            </select>
            <div class="replay-toggle-container hidden" id="replay-toggle-group">
              <button type="button" id="replay-toggle-btn" class="replay-toggle red" onclick="toggleReplayFlag()">Has 100% replay</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-close" onclick="closeImageModal()">Save</button>
          <button class="btn-delete" onclick="deleteImageFromModal()">Delete Image</button>
        </div>
      </div>
    </div>

    <script>
      const elementcap = document.getElementById("htmlContent");
      const downloadbtn = document.getElementById("btn");

      downloadbtn.addEventListener("click", function () {
        html2canvas(elementcap, {
          allowTaint: true,
          useCORS: true,
        }).then((canvas) => {
          const downloadLink = document.createElement("a");
          downloadLink.href = canvas.toDataURL("image/png");
          downloadLink.download = "Tier-Ranking.png";
          downloadLink.click();
        });
      });
    </script>
